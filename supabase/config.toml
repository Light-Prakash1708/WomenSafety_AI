project_id = "saahi"

[auth]
site_url = "saahi://"
additional_redirect_urls = ["saahi://"]

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6

# Contacts open the SOS link without an account.
[functions.alert-public]
verify_jwt = false

# Called by pg_cron with a shared secret, not a user token.
[functions.journey-watchdog]
verify_jwt = false

[functions.sos-dispatch]
verify_jwt = true

[functions.ai]
verify_jwt = true
