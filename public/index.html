<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="SAAHI: a safety network that remembers the pattern, signals quietly and shows you help is coming." />
    <meta name="theme-color" content="#FBF8FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SAAHI" />
    <meta name="referrer" content="no-referrer" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #FBF8FF; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Keyboard users get a clear focus ring that matches the brand. */
      :focus-visible { outline: 3px solid #FFC24B; outline-offset: 2px; }
      input:focus-visible, textarea:focus-visible { outline: 3px solid #FFC24B; outline-offset: 0; }
    </style>
  </head>
  <body>
    <noscript>SAAHI needs JavaScript to run. In an emergency, call 112.</noscript>
    <div id="root"></div>
  </body>
</html>
